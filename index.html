<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laura Suttie</title>
    <meta
      name="description"
      content="My corner of the internet"
    >
    <link rel="icon" href="laura-photo.jpeg" type="image/jpeg">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link rel="stylesheet" href="styles.css?v=61">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#about" aria-label="Home">
        <img src="laura-photo.jpeg" alt="Laura Suttie">
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#building">Building</a>
        <a href="#favoriting">Favorites</a>
        <a href="#speaking">Talks</a>
        <a href="#work-with-me">Work With Me</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="about" aria-labelledby="intro-title">
        <h1 id="intro-title"></h1>

        <aside class="snapshot" aria-label="Quick profile details">
          <div class="portrait-art">
            <span class="initials" data-content="initials">LS</span>
          </div>
        </aside>

        <div class="hero-copy">
          <p class="eyebrow intro-label">About</p>
          <p class="intro" id="intro-text"></p>
        </div>
      </section>

      <section class="section" id="building" aria-label="Building">
        <div class="section-heading">
          <p class="eyebrow">Building</p>
        </div>
        <div class="case-study-grid" id="building-cards"></div>
      </section>

      <!--
      <section class="section" id="writing" aria-label="Writing">
        <div class="section-heading">
          <p class="eyebrow">Writing</p>
        </div>
        <div class="writing-list" id="writing-list"></div>
      </section>
      -->

      <section class="section favoriting" id="favoriting" aria-label="Favoriting">
        <div class="section-heading">
          <p class="eyebrow">Favoriting</p>
        </div>
        <div class="favorites" id="favorites-list"></div>
      </section>

      <section class="section" id="speaking" aria-label="Talks">
        <div class="section-heading">
          <p class="eyebrow">Talks</p>
        </div>
        <div class="timeline" id="speaking-list"></div>
      </section>

      <section class="section" id="work-with-me" aria-label="Work With Me">
        <div class="section-heading">
          <p class="eyebrow">Work With Me</p>
        </div>
        <div class="work-with-me" id="work-with-me-content"></div>
      </section>
    </main>

    <footer>
      <p>© <span id="year">2026</span> Laura</p>
      <div class="footer-links" id="footer-links"></div>
    </footer>

    <script src="content.js?v=48"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <script src="render.js?v=38"></script>
  </body>
</html>
